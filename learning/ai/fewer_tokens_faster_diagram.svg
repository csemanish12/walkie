<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Same model, same laptop, same question: 44.6 s to 0.5 s</title>
<desc>Three runs of gemma4:e4b on an M1 MacBook. Defaults: 755 tokens, 44.6 seconds, about a third spent thinking. Thinking off: 157 tokens, 14.1 seconds, 4.4 of them loading the model. Thinking off plus a one-line system prompt: 2 tokens, 0.5 seconds. Speed stayed about 17 tokens per second throughout.</desc>
<defs>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="10" height="10" fill="#FFFFFF"/>
<line x1="0" y1="0" x2="0" y2="10" stroke="#B4B2A9" stroke-width="3"/>
</pattern>
</defs>

<rect width="1080" height="1080" fill="#FFFFFF"/>

<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">

<!-- Title -->
<text x="80" y="118" font-size="46" font-weight="700" fill="#2C2C2A">Same model. Same laptop.</text>
<text x="80" y="172" font-size="46" font-weight="700" fill="#2C2C2A">Same question.</text>
<text x="80" y="220" font-size="23" fill="#5F5E5A">gemma4:e4b on an M1 MacBook, asked “what is the color of sky?”</text>

<!-- Legend -->
<rect x="80" y="252" width="22" height="22" rx="3" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
<text x="112" y="270" font-size="20" fill="#444441">thinking (hidden)</text>
<rect x="300" y="252" width="22" height="22" rx="3" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/>
<text x="332" y="270" font-size="20" fill="#444441">writing the answer</text>
<rect x="536" y="252" width="22" height="22" rx="3" fill="url(#hatch)" stroke="#888780" stroke-width="1"/>
<text x="568" y="270" font-size="20" fill="#444441">loading the model</text>

<!-- Scale: 0 s at x=80, 45 s at x=1000 (20.44 px per second) -->

<!-- Run 1: defaults, 44.6 s; ~1/3 thinking -->
<text x="80" y="342" font-size="26" font-weight="600" fill="#2C2C2A">1. Defaults</text>
<rect x="80" y="360" width="304" height="62" rx="4" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
<rect x="384" y="360" width="608" height="62" rx="4" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/>
<text x="232" y="399" text-anchor="middle" font-size="21" fill="#26215C">≈⅓ thinking*</text>
<text x="688" y="399" text-anchor="middle" font-size="21" fill="#2C2C2A">answer</text>
<text x="80" y="462" font-size="30" font-weight="700" fill="#2C2C2A">44.6 s</text>
<text x="196" y="462" font-size="22" fill="#5F5E5A">755 tokens → an essay with headings, a table, emoji</text>

<!-- Run 2: think false, 14.1 s = 4.4 s load + ~9.7 s -->
<text x="80" y="542" font-size="26" font-weight="600" fill="#2C2C2A">2. Thinking turned off</text>
<rect x="80" y="560" width="90" height="62" rx="4" fill="url(#hatch)" stroke="#888780" stroke-width="1"/>
<rect x="170" y="560" width="198" height="62" rx="4" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/>
<text x="269" y="599" text-anchor="middle" font-size="21" fill="#2C2C2A">answer</text>
<text x="80" y="662" font-size="30" font-weight="700" fill="#2C2C2A">14.1 s</text>
<text x="196" y="662" font-size="22" fill="#5F5E5A">157 tokens → still a markdown list</text>

<!-- Run 3: + system prompt, 0.5 s -->
<text x="80" y="742" font-size="26" font-weight="600" fill="#2C2C2A">3. Plus: “answer in one short plain-text line”</text>
<rect x="80" y="760" width="11" height="62" rx="2" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="80" y="862" font-size="30" font-weight="700" fill="#0F6E56">0.5 s</text>
<text x="196" y="862" font-size="22" fill="#5F5E5A">2 tokens → “blue”</text>

<!-- Takeaway -->
<rect x="80" y="910" width="920" height="96" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="540" y="950" text-anchor="middle" font-size="25" font-weight="600" fill="#04342C">Speed never changed: ~17 tokens per second.</text>
<text x="540" y="984" text-anchor="middle" font-size="23" fill="#085041">The only way to a faster answer is fewer tokens.</text>

<text x="80" y="1046" font-size="16" fill="#888780">Bars drawn to scale. *Thinking share measured in a separate streaming run (19.5 s of 55 s).</text>

</g>
</svg>
