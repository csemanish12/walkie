<svg width="680" height="348" viewBox="0 0 680 348" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Training vs running an LLM locally</title>
<desc>Training happens once, elsewhere, producing a weights file. That file is quantized from 8GB to 3GB, then run locally on a laptop.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="348" fill="#FFFFFF"/>

<rect x="230" y="60" width="220" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="82" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Training</text>
<text x="340" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">Thousands of GPUs, weeks</text>

<line x1="340" y1="116" x2="340" y2="152" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="156" width="220" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="178" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Weights file</text>
<text x="340" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">Billions of frozen numbers</text>

<line x1="450" y1="188" x2="486" y2="188" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>

<rect x="490" y="150" width="150" height="76" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="565" y="170" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Quantization</text>
<text x="565" y="188" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">16-bit, 8GB</text>
<text x="565" y="202" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">4-bit, 3GB</text>

<line x1="340" y1="212" x2="340" y2="248" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="252" width="220" height="56" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="274" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Running locally</text>
<text x="340" y="292" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">Your laptop's memory + GPU</text>

</svg>
