<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Same 16 bits, two different rulers: FP16 vs BF16</title>
<desc>FP16 is a short ruler with fine markings that ends at 65,504, so 70,000 falls off the end and becomes infinity. BF16 is a very long ruler with coarse markings, so 70,000 lands at 70,144. Zoomed in between 1.000 and 1.010, FP16 has a mark every 0.001 and keeps 1.001, while BF16 has one mark at 1.0078, so 1.001 rounds to 1.0.</desc>
