<text x="80" y="894" font-size="19" fill="#5F5E5A">Neither keeps the tiny update, so training stores a 32-bit master copy of the weights.</text>
<rect x="80" y="918" width="920" height="66" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="540" y="960" text-anchor="middle" font-size="25" font-weight="600" fill="#26215C">For training, range beats precision. That’s why models ship in BF16.</text>
<text x="80" y="1020" font-size="16" fill="#888780">Every value computed with numpy + ml_dtypes (the bfloat16 type used by JAX and TensorFlow).</text>
