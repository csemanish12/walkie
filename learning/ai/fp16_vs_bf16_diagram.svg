<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<text x="80" y="100" font-size="46" font-weight="700" fill="#2C2C2A">Same 16 bits.</text>
<text x="80" y="154" font-size="46" font-weight="700" fill="#2C2C2A">Very different numbers.</text>
<rect x="80" y="186" width="22" height="22" rx="3" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="112" y="204" font-size="20" fill="#444441">sign</text>
<rect x="210" y="186" width="22" height="22" rx="3" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
<text x="242" y="204" font-size="20" fill="#444441">exponent → range</text>
<rect x="470" y="186" width="22" height="22" rx="3" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/>
<text x="502" y="204" font-size="20" fill="#444441">mantissa → precision</text>
