<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Same 16 bits, very different numbers: FP16 vs BF16</title>
<desc>Bit layouts of FP32 (1 sign, 8 exponent, 23 mantissa), BF16 (1, 8, 7: the top 16 bits of FP32) and FP16 (1, 5, 10). 70,000 overflows to infinity in FP16 but is 70,144 in BF16. 1.001 is 1.00098 in FP16 but 1.0 in BF16. 0.00000001 is 0 in FP16 but kept in BF16. 1.0 + 0.0001 is 1.0 in both, which is why training keeps a 32-bit master copy of the weights.</desc>
