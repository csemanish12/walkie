[project]
name = "walkie-backend"
version = "0.1.0"
description = "Walkie backend: watch AI app sessions, store events, push them live"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "sqlmodel>=0.0.47",
    "uvicorn[standard]>=0.54.0",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
